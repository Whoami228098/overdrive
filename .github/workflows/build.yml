name: PS4 archive resident qualification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  resident:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install native archive and crypto test libraries
        run: |
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 install -y --no-install-recommends libarchive-dev liblzma-dev libmbedtls-dev zlib1g-dev
      - name: Run actual resident archive pipeline and hostile format fixtures with ASan and UBSan
        run: bash ps5-react/native/ps4/tests/resident/run.sh
