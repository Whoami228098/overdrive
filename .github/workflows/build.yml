name: build

# Builds run only from Run workflow: a push builds nothing. Each run puts its build in a draft
# release; publishing that draft creates its tag, and no build runs on tags, so players get the
# very files that were tested.
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Exact source commit to reproduce (empty uses this branch)
        required: false
        default: ''
      torrent_minimal:
        description: Disable DHT, LSD, NAT discovery and bootstrap for diagnosis
        type: boolean
        default: false
      diagnostic_only:
        description: Save symbols without updating draft releases or building PS4
        type: boolean
        default: false
      host_soak_minutes:
        description: Run only the host soak instead of a console build (empty disables)
        required: false
        default: ''
        type: string
      quality_only:
        description: Run the full Linux native framework suite without console packaging
        type: boolean
        default: false
      music_only:
        description: Run only the bounded local MP3 worker checks
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  ps5:
    if: ${{ inputs.host_soak_minutes == '' && !inputs.quality_only && !inputs.music_only }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}

      - name: Install the toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang-18 llvm-18 llvm-18-dev cmake ninja-build nodejs npm python3-venv \
            zlib1g-dev build-essential pkg-config unzip zip curl zstd exfatprogs exfat-fuse
          # The build wants unversioned clang and llvm-config in --llvm.
          for tool in clang clang++ llvm-config; do
            sudo ln -sf "/usr/bin/$tool-18" "/usr/local/bin/$tool"
          done
          clang --version | head -1
          llvm-config --version

      - name: Install the Python dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --disable-pip-version-check -r ps5-react/requirements.txt
          # The build spawns python3 for its own tools, so the venv goes on PATH.
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"

      - name: Check the exfat packaging
        run: |
          mkdir -p "$RUNNER_TEMP/check/payload"
          printf 'eboot' > "$RUNNER_TEMP/check/payload/eboot.bin"
          # Big enough that the image gets the same geometry as the real one.
          head -c 24000000 /dev/urandom > "$RUNNER_TEMP/check/payload/data.bin"
          sudo bash packaging/make-exfat.sh "$RUNNER_TEMP/check/payload" \
            "$RUNNER_TEMP/check/check.exfat" CHECK

      - name: Cache the downloaded sources
        uses: actions/cache@v4
        with:
          path: ps5-react/.deps
          key: deps-${{ hashFiles('ps5-react/dependencies.lock.json') }}

      - name: Build
        working-directory: ps5-react
        env:
          TORRENT_MINIMAL: ${{ inputs.torrent_minimal && '1' || '0' }}
        run: python3 tools/build_ps5.py --app-dir "$GITHUB_WORKSPACE/app" --llvm /usr/bin

      - name: Save symbols and native diagnostics
        if: always()
        run: |
          mkdir -p native-diagnostics
          git rev-parse HEAD > native-diagnostics/source-commit.txt
          printf 'TORRENT_MINIMAL=%s\n' '${{ inputs.torrent_minimal && '1' || '0' }}' > native-diagnostics/mode.txt
          build=ps5-react/.build/app/ps5
          if [ -f "$build/llvm-pie.elf" ]; then
            cp "$build/llvm-pie.elf" native-diagnostics/
            llvm-nm-18 --numeric-sort --print-size --demangle "$build/llvm-pie.elf" > native-diagnostics/llvm-pie.symbols.txt
            llvm-readelf-18 --dyn-syms --wide "$build/llvm-pie.elf" > native-diagnostics/llvm-pie.dyn-syms.txt
            llvm-readelf-18 --relocations --wide "$build/llvm-pie.elf" > native-diagnostics/llvm-pie.relocations.txt
          fi
          for file in eboot.elf llvm-pie.map native-imports.json native-import-audit.cpp link.log torrent-queue-tests.log native-network-tests.log native-import-tests.log js-heap-tests.log search-tests.log; do
            if [ -f "$build/$file" ]; then cp "$build/$file" native-diagnostics/; fi
          done

      - name: Upload native diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Native-diagnostics
          path: native-diagnostics/
          if-no-files-found: error

      - name: Package
        run: |
          sudo bash packaging/make-exfat.sh ps5-react/dist/PPSA99058 Overdrive.exfat OVERDRIVE
          # The in-app updater fetches one name, for an image install: the image
          # alone at the root of update.zip.
          zip -q -X -j update.zip Overdrive.exfat
          unzip -l update.zip
          ls -l Overdrive.exfat update.zip ps5-react/dist/

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Overdrive
          path: |
            Overdrive.exfat
            update.zip
            ps5-react/dist/PPSA99058.receipt.json
          if-no-files-found: error

      - name: Draft release
        # Only people with write access see a draft, and the in-app update feed
        # (releases/latest) never returns one, so a test build reaches nobody else.
        # The draft is named after app/version.js; building again replaces its files
        # and moves it to this commit. A version already published is left alone.
        if: github.event_name == 'workflow_dispatch' && !inputs.diagnostic_only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/.*var VERSION = "\([^"]*\)".*/\1/p' app/version.js)
          test -n "$version" || { echo "no VERSION in app/version.js" >&2; exit 1; }
          tag="v$version"
          assets="Overdrive.exfat update.zip"
          draft=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            --jq ".[] | select(.tag_name == \"$tag\") | .draft")
          case "$draft" in
            "")
              gh release create "$tag" $assets --draft --target "$GITHUB_SHA" \
                --title "Overdrive $tag" --notes "Test build of $GITHUB_SHA." ;;
            true)
              gh release edit "$tag" --target "$GITHUB_SHA" --notes "Test build of $GITHUB_SHA."
              gh release upload "$tag" $assets --clobber ;;
            *)
              echo "$tag is already published: raise the version in app/version.js" >&2
              exit 1 ;;
          esac
          gh release view "$tag" --json isDraft,tagName,assets \
            --jq '"\(.tagName) draft=\(.isDraft) " + ([.assets[] | "\(.name) \(.size)"] | join(", "))'

  host-soak:
    if: ${{ inputs.host_soak_minutes != '' && !inputs.quality_only && !inputs.music_only }}
    uses: ./.github/workflows/torrent-soak.yml
    with:
      source_ref: ${{ inputs.source_ref || github.sha }}
      minutes: ${{ inputs.host_soak_minutes }}

  quality:
    if: ${{ inputs.quality_only && !inputs.music_only }}
    uses: ./.github/workflows/quality.yml
    with:
      source_ref: ${{ inputs.source_ref || github.sha }}

  music-quality:
    if: ${{ inputs.music_only }}
    uses: ./.github/workflows/music-quality.yml
    with:
      source_ref: ${{ inputs.source_ref || github.sha }}

  ps4:
    if: ${{ !inputs.diagnostic_only && inputs.host_soak_minutes == '' && !inputs.quality_only && !inputs.music_only }}
    needs: ps5
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Cache the OpenOrbis toolchain
        uses: actions/cache@v4
        with:
          path: /opt/openorbis
          key: openorbis-v0.5.4

      - name: Install the PS4 toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 lld llvm-18
          if [ ! -d /opt/openorbis/OpenOrbis/PS4Toolchain ]; then
            curl -L -o /tmp/oo.tar.gz \
              https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/download/v0.5.4/toolchain-llvm-18.tar.gz
            sudo mkdir -p /opt/openorbis
            sudo tar -xzf /tmp/oo.tar.gz -C /opt/openorbis
          fi
          echo "OO_PS4_TOOLCHAIN=/opt/openorbis/OpenOrbis/PS4Toolchain" >> "$GITHUB_ENV"
          sudo ln -sf /usr/bin/ld.lld-18 /usr/local/bin/ld.lld
          sudo ln -sf /usr/bin/clang-18 /usr/local/bin/clang
          sudo ln -sf /usr/bin/clang++-18 /usr/local/bin/clang++
          # PkgTool (.NET) needs real OpenSSL 1.1 (ERR_put_error was removed in 3.x).
          curl -sL -o /tmp/libssl1.1.deb \
            http://old-releases.ubuntu.com/ubuntu/pool/main/o/openssl/libssl1.1_1.1.1-1ubuntu2.2_amd64.deb
          sudo dpkg -i /tmp/libssl1.1.deb || sudo apt-get install -f -y
          /usr/lib/llvm-18/bin/clang --version | head -1

      - name: Build
        working-directory: native/ps4
        run: |
          PATH="/usr/lib/llvm-18/bin:$PATH"
          make

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Overdrive-PS4
          path: native/ps4/IV0000-ODRV00001_00-OVERDRIVEPS40000.pkg
          if-no-files-found: error

      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/.*var VERSION = "\([^"]*\)".*/\1/p' app/version.js)
          test -n "$version" || { echo "no VERSION in app/version.js" >&2; exit 1; }
          tag="v$version"
          draft=$(gh api "repos/$GITHUB_REPOSITORY/releases" \
            --jq ".[] | select(.tag_name == \"$tag\") | .draft")
          case "$draft" in
            "")
              gh release create "$tag" native/ps4/*.pkg --draft --target "$GITHUB_SHA" \
                --title "Overdrive $tag" --notes "Test build of $GITHUB_SHA." ;;
            true)
              gh release upload "$tag" native/ps4/*.pkg --clobber ;;
            *)
              echo "$tag is already published: attaching nothing" >&2 ;;
          esac
          gh release view "$tag" --json assets --jq '"ps4 asset: " + ([.assets[].name] | join(", "))'
