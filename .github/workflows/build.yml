name: Archive recovery qualification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  archive:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install archive development prerequisites
        run: |
          sudo apt-get update -o Acquire::Retries=2 -o Acquire::http::Timeout=20
          sudo apt-get install -y --no-install-recommends clang libarchive-dev libarchive-tools liblzma-dev libssl-dev zlib1g-dev
      - name: Actual worker restart, UI crash, locks and SHA-256 recovery
        run: python3 -u ps5-react/tools/test_durable_archives.py
      - name: Existing real format and hostile archive regressions
        run: python3 -u ps5-react/tools/test_archives.py
      - name: Exact release metadata and restored queue regressions
        run: node --test app/data/user-catalog.test.mjs app/state/*.test.mjs
