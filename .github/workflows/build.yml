name: PS4 worker qualification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  workers:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run actual workers with owned SDK doubles and ASan/UBSan
        run: bash ps5-react/native/ps4/tests/worker/run.sh
